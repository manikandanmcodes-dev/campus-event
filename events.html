<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus Events - Tech Fest 2026</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../css/style.css">

</head>


<body class="antialiased">

<div class="search-overlay" onclick="exitSearchMode()"></div>


<header class="max-w-6xl mx-auto px-6 pt-20 pb-12">

<div class="text-center mb-6">

<div class="flex items-center justify-center gap-2 text-[13px] font-semibold text-gray-800 mb-4">
<i data-lucide="calendar" class="w-4 h-4 text-black"></i>
<span>Annual Tech Fest 2026</span>
</div>

<h1 class="text-7xl font-[800] tracking-tighter mb-6 leading-none">
Campus Events
</h1>

<p class="text-gray-600 text-lg leading-relaxed max-w-lg mx-auto">
Discover what's happening around the campus today.
</p>

</div>

</header>


<div class="safe-content max-w-6xl mx-auto px-6 pb-32">


<div class="mb-20">

<div class="search-container group relative flex items-center gap-3 px-6 py-4 border border-gray-200 overflow-hidden cursor-pointer" onclick="enterSearchMode()">

<div class="bg-fill absolute inset-0 bg-black translate-y-full group-hover:translate-y-0 z-0"></div>

<i data-lucide="search" class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors duration-500 relative z-10"></i>

<input
type="text"
id="eventSearch"
placeholder="Search specific events..."
class="bg-transparent w-full text-base font-medium outline-none relative z-10 transition-colors duration-500 group-hover:text-white group-hover:placeholder:text-gray-500"
onkeyup="filterEvents()">

</div>

</div>


<h2 class="text-2xl font-bold mb-10 tracking-tight">
Today's Schedule
</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="event-grid"></div>

</div>



<!-- MODAL -->

<div
id="modal"
class="fixed inset-0 z-[100] flex items-center justify-center modal-backdrop bg-black/40 p-6 hidden"
onclick="closeModal()"
>

<div
class="modal-card bg-white w-full max-w-3xl rounded-lg shadow-2xl overflow-hidden relative border border-gray-200"
onclick="event.stopPropagation()"
>

<button
onclick="closeModal()"
class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-black hover:text-white transition-all"
>

<i data-lucide="x" class="w-4 h-4"></i>

</button>


<div class="p-10">

<div id="modal-badge-container" class="mb-4"></div>

<h2
id="modal-title"
class="text-5xl font-[800] tracking-tighter mb-8 leading-tight"
>
</h2>


<div class="grid grid-cols-2 gap-10 pt-10 border-t border-gray-100">

<div class="space-y-6">

<div class="flex items-center gap-4 text-black">

<i data-lucide="clock" class="w-5 h-5"></i>

<div>
<p id="modal-time" class="font-bold text-sm"></p>
<p class="text-[10px] text-gray-400 font-bold uppercase">Start Time</p>
</div>

</div>


<div class="flex items-center gap-4 text-black">

<i data-lucide="map-pin" class="w-5 h-5"></i>

<div>
<p id="modal-location" class="font-bold text-sm"></p>
<p class="text-[10px] text-gray-400 font-bold uppercase">Venue</p>
</div>

</div>

</div>


<div class="bg-gray-50 p-6 rounded-lg">

<p
id="modal-long-desc"
class="text-xs text-gray-600 leading-relaxed"
></p>

</div>

</div>


<div class="mt-10">

<button onclick="goToMap()">
class="group relative w-full border border-black rounded-lg py-4 font-bold flex items-center justify-center gap-2 overflow-hidden transition-all"
>

<div class="absolute inset-0 bg-black translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>

<i data-lucide="map" class="w-5 h-5 relative z-10 group-hover:text-white"></i>

<span class="relative z-10 group-hover:text-white">
Find on Map
</span>

</button>

</div>

</div>

</div>

</div>


<script src="../js/events.js"></script>

</body>

</html>
